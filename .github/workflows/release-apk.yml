name: Build signed release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore signing key from encrypted secret
        shell: bash
        env:
          RADIO_KEYSTORE_BASE64: ${{ secrets.RADIO_KEYSTORE_BASE64 }}
          RADIO_KEYSTORE_PASSWORD: ${{ secrets.RADIO_KEYSTORE_PASSWORD }}
          RADIO_KEY_PASSWORD: ${{ secrets.RADIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RADIO_KEYSTORE_BASE64" || -z "$RADIO_KEYSTORE_PASSWORD" || -z "$RADIO_KEY_PASSWORD" ]]; then
            echo 'Missing release signing secrets.' >&2
            exit 1
          fi
          printf '%s' "$RADIO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radio-release.p12"
          test -s "$RUNNER_TEMP/radio-release.p12"
      - name: Build signed release APK
        env:
          RADIO_KEYSTORE_PATH: ${{ runner.temp }}/radio-release.p12
          RADIO_KEYSTORE_PASSWORD: ${{ secrets.RADIO_KEYSTORE_PASSWORD }}
          RADIO_KEY_PASSWORD: ${{ secrets.RADIO_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Check APK signing
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: DeLasSierrasRadio-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
